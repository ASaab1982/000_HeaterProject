[env:esp32-s3-devkitc-1]
build_flags = -DINCLUDE_uxTaskGetStackHighWaterMark=1
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_port = /dev/ttyACM0
upload_port = /dev/ttyACM0

lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.6
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    arduino-libraries/ArduinoMqttClient @ ^0.1.8
    bblanchon/ArduinoJson @ ^7.0.4
    h2zero/NimBLE-Arduino @ ^1.4.2

; ============================================================
; MIGRATION NOTES — UNO R4 WiFi → ESP32-S3
; ============================================================
; [CHANGED] arduino-libraries/Servo → madhephaestus/ESP32Servo
;   The standard Arduino Servo library uses AVR/ARM hardware
;   timers that do not exist on the ESP32. ESP32Servo is a
;   drop-in replacement that uses the ESP32 LEDC timer system.
;   API is identical: attach(), write(), read() all work the same.
;
; [REMOVED] arduino-libraries/Stepper
;   No stepper motor is used in the heater project.
;   This was a leftover dependency from an earlier version.
;
; [KEPT] adafruit/DHT sensor library — compatible with ESP32
; [KEPT] adafruit/Adafruit Unified Sensor — compatible with ESP32
; [KEPT] arduino-libraries/ArduinoMqttClient — compatible with ESP32
; [KEPT] bblanchon/ArduinoJson — compatible with ESP32
; ============================================================